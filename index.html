<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diff viewer</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --bar: #f6f8fa;
    --accent: #0969da;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
      --bar: #151b23;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bar);
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .stats { color: var(--muted); }
  header .spacer { flex: 1; }
  header label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  a { color: var(--accent); }
  #view { flex: 1; min-height: 0; overflow: auto; }
  .error { color: #cf222e; padding: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 id="title">Diff viewer</h1>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="split"> split</label>
  <label><input type="checkbox" id="wrap"> wrap</label>
</header>
<div id="view"></div>
<script type="module">
  import { CodeView, parsePatchFiles } from 'https://cdn.jsdelivr.net/npm/@pierre/diffs@1.5.2/+esm';

  const view = document.getElementById('view');

  function pref(key, fallback) {
    try {
      const value = localStorage.getItem(`diff-viewer:${key}`);
      return value === null ? fallback : value === 'true';
    } catch {
      return fallback;
    }
  }
  function setPref(key, value) {
    try { localStorage.setItem(`diff-viewer:${key}`, String(value)); } catch {}
  }

  async function showPatch() {
    const response = await fetch('/patch');
    if (!response.ok) throw new Error(`/patch: ${response.status}`);
    const name = response.headers.get('X-Patch-Name');
    document.title = name;
    document.getElementById('title').textContent = name;
    const files = parsePatchFiles(await response.text()).flatMap((p) => p.files);

    let additions = 0;
    let deletions = 0;
    for (const file of files) {
      for (const hunk of file.hunks) {
        additions += hunk.additionLines;
        deletions += hunk.deletionLines;
      }
    }
    document.getElementById('stats').textContent =
      `${files.length} files, +${additions} −${deletions}`;

    const split = document.getElementById('split');
    const wrap = document.getElementById('wrap');
    split.checked = pref('split', true);
    wrap.checked = pref('wrap', false);
    const options = () => ({
      theme: { light: 'pierre-light', dark: 'pierre-dark' },
      themeType: 'system',
      diffStyle: split.checked ? 'split' : 'unified',
      overflow: wrap.checked ? 'wrap' : 'scroll',
      stickyHeaders: true,
    });

    const codeView = new CodeView(options());
    codeView.setup(view);
    codeView.setItems(files.map((fileDiff, index) => ({
      id: `${index}:${fileDiff.name}`,
      type: 'diff',
      fileDiff,
    })));
    for (const [key, input] of [['split', split], ['wrap', wrap]]) {
      input.addEventListener('change', () => {
        setPref(key, input.checked);
        codeView.setOptions(options());
      });
    }
  }

  try {
    await showPatch();
  } catch (error) {
    view.innerHTML = '';
    const pre = document.createElement('pre');
    pre.className = 'error';
    pre.textContent = String(error.stack || error);
    view.append(pre);
  }
</script>
</body>
</html>
